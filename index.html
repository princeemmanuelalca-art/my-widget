<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Quote Widget</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0d0d0d;
    --card: #141414;
    --border: #222;
    --accent: #c8a96e;
    --text: #e8e3da;
    --sub: #6b6560;
  }
  body {
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'DM Mono', monospace;
    padding: 24px;
  }
  .widget {
    width: 340px;
    height: 340px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 44px;
    padding: 28px 26px 22px;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.04) inset,
      0 24px 48px rgba(0,0,0,0.6),
      0 8px 16px rgba(0,0,0,0.4);
  }
  .widget::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.6;
  }
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .label {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--sub);
  }
  .date {
    font-size: 9px;
    letter-spacing: 0.1em;
    color: var(--sub);
  }
  .quote-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
  }
  .open-mark {
    font-family: 'Playfair Display', serif;
    font-size: 48px;
    line-height: 1;
    color: var(--accent);
    opacity: 0.25;
    position: absolute;
    top: -8px;
    left: -4px;
    pointer-events: none;
  }
  .quote-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
    line-height: 1.65;
    color: var(--text);
    padding-left: 10px;
    position: relative;
    z-index: 1;
  }
  .footer {
    margin-top: 14px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }
  .source { display: flex; flex-direction: column; gap: 3px; }
  .author { font-size: 10px; color: var(--accent); letter-spacing: 0.05em; }
  .book { font-size: 9px; color: var(--sub); letter-spacing: 0.04em; }
  .controls { display: flex; gap: 8px; align-items: center; }
  .btn {
    width: 28px; height: 28px;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.04);
    color: var(--sub);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px;
    border-radius: 50%;
    transition: all 0.2s;
    font-family: 'DM Mono', monospace;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .counter { font-size: 9px; color: var(--sub); min-width: 40px; text-align: center; letter-spacing: 0.05em; }
  .progress { position: absolute; bottom: 0; left: 0; height: 1px; background: var(--accent); opacity: 0.4; transition: width 0.4s ease; }
  .fade-enter { animation: fadeIn 0.3s ease forwards; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
<div class="widget">
  <div class="progress" id="progress"></div>
  <div class="header">
    <span class="label">Daily Wisdom</span>
    <span class="date" id="dateDisplay"></span>
  </div>
  <div class="quote-wrap">
    <div class="open-mark">"</div>

  </div>
  <div class="footer">
    <div class="source">
      <span class="author" id="quoteAuthor"></span>
      <span class="book" id="quoteBook"></span>
    </div>
    <div class="controls">
      <button class="btn" id="prevBtn">&#8592;</button>
      <span class="counter" id="counter"></span>
      <button class="btn" id="nextBtn">&#8594;</button>
    </div>
  </div>
</div>
